name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    # Postgres 16, matching docker-compose.yml's image. Host port 5432 (not the
    # local dev override of 5433) — that override exists only because a native
    # Postgres already owns 5432 on this developer's machine; a GitHub-hosted
    # runner has no such conflict, and 5432 is Postgres's own default port.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: diary
          POSTGRES_PASSWORD: diary
          POSTGRES_DB: diary
        ports:
          - 5432:5432
        # The job waits for this before any step runs. Without it, `npm run
        # db:migrate` or the integration suite could start against a Postgres
        # that isn't accepting connections yet — an intermittent failure that
        # trains people to hit re-run rather than a consistent, honest one.
        options: >-
          --health-cmd "pg_isready -U diary"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://diary:diary@localhost:5432/diary
      # Throwaway CI-only value. Long enough to satisfy apps/web/lib/env.ts's
      # parseEnv (>= 32 characters) — never used outside this workflow.
      PAYLOAD_SECRET: ci-only-secret-value-never-used-outside-actions-32
      MEDIA_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Must precede the integration tests: they assert against real journeys/
      # pages tables, which only exist once the first migration has run.
      - run: npm run db:migrate -w apps/web
      - run: npm run verify:full

  # Second, independent job (Task 12): the browser, accessibility, visual
  # and performance suites from CLAUDE.md §2, run against a *built* app —
  # `next start`, not `next dev` — with its own migrated, seeded Postgres.
  # Kept separate from `verify` above so that job stays exactly what
  # docs/testing.md promises it is: Docker-free and fast. This job needs
  # Docker (the postgres service) and a browser binary, and is slower by
  # design — a build, a migration, a seed and three real browser projects.
  #
  # Runs INSIDE `mcr.microsoft.com/playwright:v1.62.1-noble` (Task 1) — the
  # version pin matches package-lock.json's `@playwright/test` exactly, and
  # must be bumped alongside it. This is the fix for a real, previously-
  # documented gap: `toHaveScreenshot` baselines are keyed by OS and font
  # rendering, so Windows-generated baselines (`-win32.png`) never honestly
  # compared against this job's Ubuntu rendering, regardless of whether a
  # page had actually changed. Generating AND comparing inside the same
  # pinned image (see docs/testing.md's Visual regression section) closes
  # that gap instead of working around it — the committed baselines are now
  # `-linux.png`, produced by running `npx playwright test
  # e2e/visual.spec.ts --update-snapshots` inside this exact image.
  browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    # Same image and health-check reasoning as `verify` above; a second,
    # independent Postgres instance, unrelated to either developer's local
    # Postgres (5433) or `verify`'s (a different job, a different runner).
    # Reached at the service id (`postgres`), not `localhost`: once the job
    # itself runs inside a container (above), GitHub Actions puts the job
    # and its service containers on one Docker network addressed by service
    # name, rather than mapping the service's port onto the runner's own
    # localhost the way an uncontainerized job would.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: diary
          POSTGRES_PASSWORD: diary
          POSTGRES_DB: diary
        options: >-
          --health-cmd "pg_isready -U diary"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://diary:diary@postgres:5432/diary
      PAYLOAD_SECRET: ci-only-secret-value-never-used-outside-actions-32
      MEDIA_ORIGIN: http://localhost:3000
      CI: true
    steps:
      - uses: actions/checkout@v4
      # No actions/setup-node and no `playwright install`: the pinned image
      # already ships a matching Node (>=22, satisfying package.json's
      # `engines`) and every Playwright browser this repo uses pre-installed.
      - run: npm ci
      # playwright.config.ts's webServer builds and `next start`s the app
      # itself once CI=true, so no separate build/start step is needed here
      # — but the database it starts against must already be migrated and
      # seeded first, matching the Phase 0 exit criterion ("a built app with
      # a migrated, seeded database"), and matching what a real deploy does.
      - run: npm run db:migrate -w apps/web
      - run: npm run db:seed -w apps/web
      # One Playwright invocation for all three suites (rather than chaining
      # `npm run test:e2e`, `npm run test:a11y` and `npm run test:visual` as
      # separate steps): with `reuseExistingServer` off in CI
      # (playwright.config.ts), each invocation would otherwise re-run
      # `next build` from scratch. `e2e/visual.spec.ts` now runs here too —
      # see this job's own header for why its baselines finally compare
      # honestly on this runner.
      # Every spec file, named explicitly rather than by directory, so adding
      # one without adding it here is a visible omission in a diff. Phase 1
      # Task 9 added `e2e/pages.spec.ts` (the Cover and Contents pages'
      # browser-only geometry) and, at the same time, `e2e/book.spec.ts` and
      # `e2e/flip.spec.ts` - which `npm run test:e2e` has named since Tasks 7
      # and 8 but this job did not, so their assertions (the back face
      # swallowing clicks, the transform-only budget, all five turn triggers)
      # had never actually gated a merge.
      # Task 10's `e2e/notes.spec.ts` and the LCP fix's
      # `e2e/imageWindow.spec.ts` are named here too. `notes.spec.ts` had
      # been in `npm run test:e2e` since Task 10 without being in this job,
      # so the focal-point and highlight-gap cases had never gated a merge —
      # exactly the omission this list exists to make visible.
      # Task 12 adds its own `e2e/chrome.spec.ts` and, in the same line, the
      # three this list had drifted past: `e2e/frames.spec.ts` and
      # `e2e/about.spec.ts` (Task 11) and `e2e/serverWindow.spec.ts` (the
      # server content window), all three named by `npm run test:e2e` and
      # none of them gating a merge until now. `serverWindow.spec.ts` is the
      # one that matters most of the three - it is what asserts all
      # thirty-three deep links still serve their own page.
      #
      # THE LIST NO LONGER DEPENDS ON ANYONE NOTICING. Task 13 adds
      # `e2e/ciRegistration.spec.ts`, whose whole subject is this line: it
      # globs `e2e/*.spec.ts` off the filesystem and fails, naming the file,
      # if any of them is absent from this `run:` command or from the npm
      # scripts in package.json. It reads the command rather than the file,
      # so a spec named only in the comments above does not satisfy it. Twice
      # is enough; the convention is now enforced rather than remembered.
      # Task 13's own `e2e/routing.spec.ts` (the 404, the per-page metadata,
      # the canonical link and the gallery return) is named here too, and
      # Task 14's `e2e/gallery.spec.ts` (the sixty-one-tile grid, the
      # lightbox's keyboard contract, and the download served through our own
      # handler rather than a bucket URL).
      - run: npx playwright test e2e/smoke.spec.ts e2e/book.spec.ts e2e/flip.spec.ts e2e/layout.spec.ts e2e/chrome.spec.ts e2e/pages.spec.ts e2e/notes.spec.ts e2e/frames.spec.ts e2e/about.spec.ts e2e/imageWindow.spec.ts e2e/serverWindow.spec.ts e2e/routing.spec.ts e2e/gallery.spec.ts e2e/ciRegistration.spec.ts e2e/a11y.spec.ts e2e/visual.spec.ts
      # lhci's Lighthouse launch needs an explicit CHROME_PATH inside this
      # image: chrome-launcher's own auto-detection looks for a system
      # `google-chrome`/`chromium-browser` binary, which this image does not
      # install — it ships browsers under /ms-playwright instead, which is
      # exactly what the `npx playwright test` step above already used
      # successfully. Resolved with `find` rather than hard-coding the
      # versioned directory name (e.g. `chromium-1234`), which is an
      # internal Playwright build id that can change on an image update
      # this workflow did not otherwise ask for.
      - name: Locate this image's Chromium binary for Lighthouse
        run: echo "CHROME_PATH=$(find /ms-playwright -maxdepth 3 -iname chrome | head -1)" >> "$GITHUB_ENV"
      # GATED, deliberately, even though `/p/1` (lighthouserc.json's diary
      # URL) does not exist until Task 13 — this is a controller ruling for
      # Task 1, not an oversight: leaving `continue-on-error` on until the
      # route exists is exactly how this budget stayed decorative through
      # Phase 0 (see docs/testing.md's Performance section for that
      # history). Do not re-add `continue-on-error` to "fix" a future red
      # run before Task 13 lands; that reintroduces exactly the decorative
      # state this removal fixes.
      #
      # This step is RED today, and is meant to be, until Task 13 replaces
      # `/p/1`'s 404 with the real diary page — lighthouserc.json's `/p/1`
      # entry asserts `http-status-code` (fails on any 4xx/5xx) alongside
      # LCP/CLS specifically so that a fast-rendering 404 cannot pass this
      # gate on its own merits (Task 1 fix round 1 found the LCP/CLS-only
      # version doing exactly that — a 404 measured ~2.0s LCP, clearing the
      # 2500ms budget and reporting a green "diary LCP verified" against a
      # page that does not exist, which is worse than an informational red:
      # a plausible number reads as a real measurement). Do not remove
      # `http-status-code` once `/p/1` is real and returns 200 on its own —
      # it is why the LCP/CLS numbers mean anything, not leftover noise.
      # `/cms` keeps its own budget entry in lighthouserc.json
      # (`http-status-code` and CLS, no LCP) rather than sharing `/p/1`'s —
      # CLAUDE.md §6 scopes the 2500ms LCP budget to "diary, 4G"
      # specifically, and holding Payload's heavy admin bundle to it was
      # the original reason this whole step was informational.
      - name: Lighthouse CI budgets
        run: npm run test:perf
